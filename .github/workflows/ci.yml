name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run check

      - name: 単体テスト
        run: npm test

      - name: プラグインのビルド
        run: npm run build
